const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[(Math.random()*a.length)|0];

COUNTRIES.forEach(c=>{const im=new Image();im.onload=()=>{c.img=im;n++;done()};im.onerror=()=>{c.img=null;n++;done()};im.src=`https://flagcdn.com/w80/${c.code}.png`});

 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=this.c=new C();this.m=c.createGain();this.m.connect(c.destination);this.mus=c.createGain();this.sfx=c.createGain();this.mus.connect(this.m);this.sfx.connect(this.m);

t(f,d,ty='sine',v=.3,sl=0,dl=0,bus){if(!this.c)return;try{bus=bus||this.sfx;const c=this.c,t=c.currentTime+dl,o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,sl),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05)}catch(e){}},
n(d,v,f0,f1,dl=0,ty='lowpass',bus){if(!this.c)return;try{bus=bus||this.sfx;const c=this.c,t=c.currentTime+dl,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;s.loop=true;fl.type=ty;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.02,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(bus);s.start(t);s.stop(t+d+.05)}catch(e){}},
click(){this.t(880,.06,'square',.25);this.t(1320,.05,'square',.15,0,.05)},
col(s,force){if(!this.c)return;const now=performance.now();if(force)this.hits=[];this.hits=this.hits.filter(x=>now-x<1000);if(this.hits.length>=9||(this.hits.length&&now-this.hits[this.hits.length-1]<45))return;this.hits.push(now);
 const p=rnd(.9,1.1),v=clamp(.05+s/800,.05,.5),k=(Math.random()*4)|0;

two(){this.t(50,.16,'sine',1,35);this.t(50,.16,'sine',.8,35,.2);this.n(1.5,.3,100,2500)},

const VM={q:[],cur:null,v:null,ok:false,rate:1,

/* ===== PHYSICS & COLLISION ===== */
function makeFlag(c,i){return{id:i,c,name:c.name,code:c.code,x:0,y:0,vx:0,vy:0,w:34,h:23,r:14,st:'alive',kind:'',hp:100,sf:rnd(.8,1.25),t:0,pulse:0,hue:(i*47)%360}}
function place(f){f.x=rnd(30,W-30);f.y=rnd(30,W-30);const a=rnd(0,6.283),s=rnd(80,170);f.vx=Math.cos(a)*s;f.vy=Math.sin(a)*s}
const targetSize=()=>clamp(Math.sqrt(.36*W*W/Math.max(G.alive,1)/.67),26,72);
function hit(a,b,s,x,y){if(s<30)return;const k=G.state==='FINAL_TWO'?3:1;a.hp=Math.max(0,a.hp-s*.02*rnd(.6,1.4)*k/a.sf);b.hp=Math.max(0,b.hp-s*.02*rnd(.6,1.4)*k/b.sf);
 if(s>80){a.pulse=b.pulse=1;burst(x,y,s>200?8:3,'#bff',s>200?110:60,.35)}AM.col(s);if(s>260)G.shake=Math.max(G.shake,6)}
function collide(a,b){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);const m=a.r+b.r;if(d>=m)return;if(d<.001){dx=1;dy=0;d=1}
 const nx=dx/d,ny=dy/d,o=m-d;a.x-=nx*o/2;a.y-=ny*o/2;b.x+=nx*o/2;b.y+=ny*o/2;const vn=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
 if(vn>0){a.vx-=vn*nx;a.vy-=vn*ny;b.vx+=vn*nx;b.vy+=vn*ny;const im=rnd(-25,25);a.vx+=ny*im;a.vy-=nx*im;b.vx-=ny*im;b.vy+=nx*im;hit(a,b,vn,a.x+nx*a.r,a.y+ny*a.r)}}
function physics(dt){const F=G.flags,ts=targetSize(),ft=G.state==='FINAL_TWO';let dy=0;
 for(const f of F){if(f.st==='alive'){f.w+=(ts-f.w)*Math.min(1,dt*2);f.h=f.w*.67;f.r=f.w*.42;
  f.vx+=(Math.random()-.5)*220*dt;f.vy+=(Math.random()-.5)*220*dt;const d=1-.25*dt;f.vx*=d;f.vy*=d;
  let s=Math.hypot(f.vx,f.vy);if(!(s>0)){const a=rnd(0,6.283);f.vx=Math.cos(a)*100;f.vy=Math.sin(a)*100;s=100}
  const mn=ft?110:75,mx=ft?300:200;if(s<mn||s>mx){const k=clamp(s,mn,mx)/s;f.vx*=k;f.vy*=k}
  f.x+=f.vx*dt;f.y+=f.vy*dt;const hw=f.w/2,hh=f.h/2;
  if(f.x<hw){f.x=hw;f.vx=Math.abs(f.vx)}else if(f.x>W-hw){f.x=W-hw;f.vx=-Math.abs(f.vx)}
  if(f.y<hh){f.y=hh;f.vy=Math.abs(f.vy)}else if(f.y>W-hh){f.y=W-hh;f.vy=-Math.abs(f.vy)}
  f.pulse=Math.max(0,f.pulse-dt*5)}else if(f.st==='dying'){f.t+=dt;dy++;if(f.t>.95)f.st='gone'}}
 const al=F.filter(f=>f.st==='alive');
 if(ft&&al.length===2){const[a,b]=al,dx=b.x-a.x,dy2=b.y-a.y,d=Math.hypot(dx,dy2)||1;a.vx+=dx/d*140*dt;a.vy+=dy2/d*140*dt;b.vx-=dx/d*140*dt;b.vy-=dy2/d*140*dt}
 for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){const a=al[i],b=al[j];if(Math.abs(b.x-a.x)>a.r+b.r)continue;collide(a,b)}
 G.alive=al.length;G.dying=dy}
/* ===== TOURNAMENT / ELIMINATION / QUALIFICATION ===== */
const eRound=r=>Math.round((N-Q)*r/Q)-Math.round((N-Q)*(r-1)/Q);
const score=f=>f.hp+f.sf*8+rnd(0,6);
function beginRound(){G.elimTotal=G.elimLeft=eRound(G.round);G.roundT=0}
function eliminate(f){f.st='dying';f.kind='elim';f.t=0;AM.elim();VM.announceElimination(f.name);burst(f.x,f.y,10,'#f74',120,.6);
 const n=$('notif');n.innerHTML=`${fi(f.c)}<b>${f.name.toUpperCase()}</b><small>ELIMINATED</small>`;n.classList.remove('show');void n.offsetWidth;n.classList.add('show');
 G.alive--;if(G.state==='FINALS'&&G.alive>2&&G.alive%10===0)VM.say(words(G.alive)+' flags remain.',2)}
function eliminateLowest(){const al=aliveList();if(al.length<2)return;const s=al.map(f=>[score(f),f]).sort((a,b)=>a[0]-b[0]);eliminate(s[0][1])}
function tourney(dt){const s=G.state;
 if(s==='QUALIFYING'){G.roundT+=dt;
  if(G.alive===0&&G.dying===0){startFinals();return}
  if(G.elimLeft>0&&G.roundT>=ROUND_SEC*(G.elimTotal-G.elimLeft+1)/(G.elimTotal+1)){eliminateLowest();G.elimLeft--}
  else if(G.elimLeft===0&&G.roundT>=ROUND_SEC&&G.dying===0)roundWinner()}
 else if(s==='FINALS'){if(G.alive<=2&&G.dying===0){startFinalTwo();return}
  if(G.alive>2){G.finT+=dt;if(G.finT>=FIN_INT){G.finT=0;eliminateLowest()}}}
 else if(s==='FINAL_TWO'){if(!G.ftDone){G.ftT+=dt;const al=aliveList();if(G.ftT>1.5&&(al.some(f=>f.hp<=0)||G.ftT>16)){G.ftDone=true;eliminateLowest()}}
  else if(G.alive<=1&&G.dying===0)champion()}}
function showOv(h){$('ov').innerHTML=h;$('ov').className='on'}
const hideOv=()=>{$('ov').className=''};
function roundWinner(){const al=aliveList();if(!al.length){startFinals();return}
 const f=al.map(x=>[score(x),x]).sort((a,b)=>b[0]-a[0])[0][1];G.state='ROUND_WINNER';f.st='dying';f.kind='qual';f.t=0;G.qualified.push(f.c);const n=G.qualified.length;
 AM.rw();VM.announceRoundWinner(f.name,n);burst(W/2,W/2,40,'#fc4',200,1.2);
 showOv(`<div class="card"><h2>ROUND WINNER</h2><img src="https://flagcdn.com/w160/${f.code}.png" alt="" onerror="this.style.display='none'"><h3>${f.name}</h3><p>QUALIFIED #${n} / ${Q}</p></div>`);
 later(()=>{hideOv();AM.qual();renderQual(true);if(n>=Q)startFinals();else{G.round++;G.state='QUALIFYING';beginRound()}},clamp(2800/G.speed,1100,3200))}
function startFinals(skip){G.state='FINALS_INTRO';hideOv();G.flags=G.qualified.map(makeFlag);G.flags.forEach(f=>{place(f);f.hp=100});G.total=G.flags.length;G.alive=G.total;G.round=Q+1;G.finT=0;AM.phase('finals');
 if(skip){G.state='FINALS';return}
 AM.finals();VM.announceFinals();G.shake=8;burst(W/2,W/2,60,'#fc4',260,1.4);
 showOv(`<div class="card"><h2>FINALS BEGIN</h2><p>${G.total} FLAGS REMAIN</p></div>`);later(()=>{hideOv();G.state='FINALS'},3600)}
function startFinalTwo(){const al=aliveList();if(al.length<2){champion();return}G.state='FINAL_TWO';G.ftT=0;G.ftDone=false;AM.phase('two');AM.two();VM.announceFinalTwo(al[0].name,al[1].name);
 showOv(`<div class="card"><h2>LAST FLAG STANDING</h2><p>2 FLAGS LEFT</p></div>`);later(hideOv,2500)}
function champion(){const w=G.flags.find(f=>f.st==='alive')||{name:G.qualified[0].name,code:G.qualified[0].code,c:G.qualified[0]};
 G.state='CHAMPION';hideOv();AM.phase('champ');AM.champ();VM.announceChampion(w.name);G.shake=14;
 $('cimg').style.display='';$('cemo').textContent='';$('cimg').onerror=()=>{$('cimg').style.display='none';$('cemo').textContent=w.c.emoji};$('cimg').src=`https://flagcdn.com/w320/${w.code}.png`;
 $('cname').textContent=w.name.toUpperCase();$('cname').classList.add('hid');$('champ').hidden=false;later(()=>$('cname').classList.remove('hid'),3400)}
/* ===== UI MANAGER ===== */
function renderQual(fresh){const q=G.qualified,s=Math.max(0,q.length-10);$('qlist').innerHTML=q.slice(s).map((c,i)=>`<div class="row${fresh&&s+i===q.length-1?' new':''}"><b>#${s+i+1}</b>${fi(c)}<span>${c.name}</span><em>WIN</em></div>`).join('')}
const mmss=s=>{s=Math.max(0,Math.ceil(s));return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function updUI(){const s=G.state;let tm=0;
 if(s==='QUALIFYING')tm=(ROUND_SEC-G.roundT)/G.speed;else if(s==='FINALS')tm=(FIN_INT-G.finT)/G.speed;else if(s==='FINAL_TWO')tm=(16-G.ftT)*2/G.speed;
 $('tmr').textContent='ELIMINATIONS IN '+mmss(tm);$('qc').textContent=`${G.qualified.length} / ${Q} QUALIFIED`;
 $('pb').style.width=(G.alive/G.total*100)+'%';$('cnt').textContent=`${G.alive} / ${G.total} FLAGS LEFT`;
 const fin=s==='FINALS'||s==='FINALS_INTRO'||s==='FINAL_TWO'||s==='CHAMPION';
 $('rl').textContent=`ROUND ${G.round} • ${fin?'FINAL':'QUALIFYING'}`;
 $('spots').textContent=s==='FINAL_TWO'?'LAST FLAG STANDING • 2 FLAGS LEFT':G.alive===1&&fin?'1 FLAG REMAINING':fin?`ROUND ${G.round} • ${G.alive} FLAGS LEFT`:`ROUND ${G.round} • ${Math.max(0,Q-G.qualified.length)} SPOTS LEFT`}
/* ===== RENDER ===== */
const cv=$('cv'),ctx=cv.getContext('2d'),sc=$('strip'),sctx=sc.getContext('2d');let DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);const a=$('arena').clientWidth;cv.width=cv.height=Math.round(a*DPR);sc.width=Math.round(sc.clientWidth*DPR);sc.height=Math.round(42*DPR)}
function drawFlag(f){let s=1,a=1,gl=null;if(f.st==='dying'){const t=f.t;gl=f.kind==='qual'?'255,210,60':'255,70,20';if(t>.35){const u=(t-.35)/.6;s=f.kind==='qual'?1+u*.5:Math.max(.05,1-u*.9);a=1-u}}
 ctx.save();ctx.translate(f.x,f.y);ctx.scale(s,s);ctx.globalAlpha=Math.max(0,a);const w=f.w,h=f.h;
 if(gl){ctx.fillStyle=`rgba(${gl},.55)`;ctx.fillRect(-w/2-4,-h/2-4,w+8,h+8)}
 if(f.pulse>0){ctx.fillStyle=`rgba(160,255,255,${f.pulse*.6})`;ctx.fillRect(-w/2-2,-h/2-2,w+4,h+4)}
 const im=f.c.img;if(im)ctx.drawImage(im,-w/2,-h/2,w,h);else{ctx.fillStyle=`hsl(${f.hue},60%,38%)`;ctx.fillRect(-w/2,-h/2,w,h);ctx.font=`${h*.8}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.c.emoji,0,0)}
 ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;ctx.strokeRect(-w/2,-h/2,w,h);ctx.restore()}
function draw(){const w=cv.width,k=w/W;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,w,w);ctx.setTransform(k,0,0,k,(Math.random()-.5)*G.shake*k,(Math.random()-.5)*G.shake*k);
 for(const f of G.flags)if(f.st!=='gone')drawFlag(f);
 for(const p of P){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.z,p.z)}ctx.globalAlpha=1}
let stripT=0;
function drawStrip(){const W2=sc.clientWidth,fl=G.flags.filter(f=>f.st==='alive'),n=fl.length,cols=Math.max(1,Math.ceil(n/3)),sw=clamp(Math.floor(W2/cols)-1,3,18),sh=Math.max(2,Math.floor(sw*.67));
 sctx.setTransform(DPR,0,0,DPR,0,0);sctx.clearRect(0,0,W2,42);fl.forEach((f,i)=>{const x=(i%cols)*(sw+1),y=((i/cols)|0)*(sh+1);if(f.c.img)sctx.drawImage(f.c.img,x,y,sw,sh);else{sctx.fillStyle=`hsl(${f.hue},60%,40%)`;sctx.fillRect(x,y,sw,sh)}})}
/* ===== MAIN LOOP ===== */
let last=0,uiT=0;
function loop(t){requestAnimationFrame(loop);const dr=Math.min(.05,(t-last)/1000||0);last=t;
 if(G.state!=='LOADING'){let ts=G.state==='START'?1:G.speed;if(G.state==='FINAL_TWO')ts*=.5;if(G.state==='CHAMPION')ts=0;
  G.acc+=dr*ts;let n=0;while(G.acc>=1/60&&n<30){physics(1/60);if(G.state!=='START')tourney(1/60);G.acc-=1/60;n++}if(n>=30)G.acc=0;
  if(G.flags.some(f=>f.st==='gone'))G.flags=G.flags.filter(f=>f.st!=='gone');
  if(G.state==='START'&&Math.random()<.1)burst(rnd(0,W),rnd(0,W),1,'#7ff',10,2);
  if(G.state==='CHAMPION')for(let i=0;i<3;i++)P.push({x:rnd(0,W),y:-5,vx:rnd(-30,30),vy:rnd(40,120),l:4,m:4,c:pick(['#fc4','#f55','#5cf','#5f8','#fff']),g:90,z:rnd(3,6)});
  updP(dr);G.shake*=.9;if(G.shake<.2)G.shake=0;
  uiT+=dr;if(uiT>.1){uiT=0;updUI()}stripT+=dr;if(stripT>.25){stripT=0;drawStrip()}}
 draw()}
/* ===== GAME STATE MANAGER ===== */
function resetGame(){G.gen++;VM.clear();G.qualified=[];G.round=1;G.roundT=0;G.elimLeft=G.elimTotal=0;G.finT=G.ftT=0;G.acc=0;G.shake=0;G.total=N;P.length=0;
 G.flags=shuffle(COUNTRIES.slice()).map(makeFlag);G.flags.forEach(place);G.alive=N;G.dying=0;hideOv();$('champ').hidden=true;$('notif').className='';renderQual();AM.phase('ambient')}
function beginPlay(){resetGame();G.state='QUALIFYING';AM.phase('qual');beginRound();VM.say('Country Flag Battle begins.',3)}
function toStart(){resetGame();G.state='START';$('start').hidden=false}
function startGame(){AM.init();VM.init();AM.click();AM.t(200,.6,'sawtooth',.2,800);$('start').hidden=true;beginPlay()}
/* ===== DEVELOPER CONTROLS ===== */
function ensureAudio(){AM.init();VM.init()}
function forceFinals(){ensureAudio();G.gen++;$('start').hidden=true;$('champ').hidden=true;G.qualified=shuffle(COUNTRIES.slice()).slice(0,Q);renderQual();startFinals()}
function forceTwo(){if(G.state==='START'||G.state==='QUALIFYING'||G.state==='ROUND_WINNER'||G.state==='CHAMPION'){forceFinals();G.gen++;hideOv();G.state='FINALS'}
 const al=shuffle(aliveList());al.slice(2).forEach(f=>f.st='gone');G.state='FINALS';startFinalTwo()}
function forceWin(){if(G.state!=='FINAL_TWO')forceTwo();G.ftDone=true;eliminateLowest()}
function buildDev(){const d=$('dev');const add=(l,fn)=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{ensureAudio();fn(b)};d.appendChild(b)};const h=t=>{const e=document.createElement('h4');e.textContent=t;d.appendChild(e)};
 h('GAME SPEED');[.5,1,2,5,10].forEach(s=>add(s+'x',()=>G.speed=s));
 h('AUDIO TEST');add('TEST COLLISION',()=>AM.col(90,1));add('TEST STRONG COLLISION',()=>AM.col(320,1));add('TEST ELIMINATION',()=>{AM.elim();VM.announceElimination('Germany')});add('TEST QUALIFICATION',()=>{AM.qual();VM.announceQualification('Morocco')});
 add('TEST ROUND WINNER',()=>{AM.rw();VM.announceRoundWinner('Liechtenstein',11)});add('TEST FINALS',()=>{AM.finals();VM.announceFinals()});add('TEST FINAL TWO',()=>{AM.two();VM.announceFinalTwo('Brazil','Japan')});add('TEST CHAMPION',()=>{AM.champ();VM.announceChampion('United States')});add('TEST VOICE',()=>VM.say('Country Flag Battle voice test.',5));
 h('TOGGLES');['voice','music','sfx'].forEach(k=>add(k.toUpperCase()+' ON/OFF',()=>{AM.on[k]=AM.on[k]?0:1;AM.apply();if(k==='voice'&&!AM.on.voice)VM.clear()}));
 const sl=(l,min,max,st,val,fn)=>{const w=document.createElement('label');w.textContent=l;const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.step=st;i.value=val;i.style.width='100%';i.oninput=()=>{fn(+i.value)};w.appendChild(i);d.appendChild(w)};
 sl('SPEECH RATE',.6,1.6,.05,1,v=>VM.rate=v);sl('VOICE VOLUME',0,1,.05,AM.vol.voice,v=>AM.vol.voice=v);sl('MUSIC VOLUME',0,.6,.02,AM.vol.music,v=>{AM.vol.music=v;AM.apply()});sl('SFX VOLUME',0,1,.02,AM.vol.sfx,v=>{AM.vol.sfx=v;AM.apply()});
 h('CONTROLS');add('SKIP ROUND',()=>{if(G.state==='QUALIFYING'){G.elimLeft=0;G.roundT=ROUND_SEC}else if(G.state==='FINALS')G.finT=99});
 add('ELIMINATE RANDOM FLAG',()=>{const al=aliveList();if(al.length>1)eliminate(pick(al))});add('FORCE FINALS',forceFinals);add('FORCE FINAL TWO',forceTwo);add('FORCE WINNER',forceWin);add('RESET GAME',toStart)}
/* ===== INIT ===== */
function setMute(m){AM.muted=m;AM.apply();$('mute').textContent=m?'🔇':'🔊';if(m)VM.clear();try{localStorage.setItem('cfb_mute',m?'1':'0')}catch(e){}}
window.addEventListener('resize',resize);
$('mute').onclick=()=>{setMute(!AM.muted)};
$('play').onclick=startGame;$('again').onclick=()=>{AM.click();beginPlay()};$('newb').onclick=()=>{AM.click();toStart()};
$('brand').ondblclick=()=>{$('dev').hidden=!$('dev').hidden};
document.addEventListener('keydown',e=>{if((e.key==='d'||e.key==='D')&&!/INPUT|TEXTAREA/.test(e.target.tagName))$('dev').hidden=!$('dev').hidden});
try{if(localStorage.getItem('cfb_mute')==='1')setMute(true)}catch(e){}
$('sub').textContent=N+' FLAGS • ONE WINNER';buildDev();resize();requestAnimationFrame(loop);
loadFlags().then(()=>{resetGame();G.state='START';$('ld').textContent=N+' FLAGS READY';$('play').disabled=false});

</script></body></html>
